<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chatbot Dashboard</title>
<style>
:root{--ink:#0F1A3D;--mut:#5B6585;--bg:#F5F6FB;--line:#E6E9F2;--b:#3B5BFF;--v:#6D5BFF;--amb:#8A4B08}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:var(--ink)}
.lbl{color:var(--mut);font-size:13px}
.btn{border:1px solid #CBD2E6;background:#fff;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.btn.on,.btn.pri{background:var(--b);border-color:var(--b);color:#fff}
.app{display:flex;min-height:100vh}
.side{width:260px;background:linear-gradient(180deg,#0E1A47,#080F2B);padding:22px 16px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;color:#fff;padding:0 6px 22px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4F6BFF,#7C5CFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.brand b{display:block;font-size:17px}.brand small{color:#A9B4E0}
.nv{display:flex;align-items:center;gap:12px;background:none;border:1px solid transparent;color:#C7D0F3;text-align:left;padding:12px 14px;border-radius:12px;font-weight:500;font-size:15px;cursor:pointer;min-height:48px;width:100%}
.nv:hover{background:rgba(255,255,255,.07)}.nv.on{background:#1B2A80;border-color:#3345B3;color:#fff}
.badge{margin-left:auto;background:#5B5BFF;color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 9px}
.me{margin-top:auto;border-top:1px solid #1E2A63;padding-top:14px;color:#fff}
.me .row{display:flex;gap:10px;align-items:center;margin-bottom:8px}.me small{color:#A9B4E0;display:block;overflow-wrap:anywhere}
.av{width:40px;height:40px;border-radius:50%;background:#DDE3FF;color:#2B3BA8;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.main{flex:1;min-width:0;padding:22px 36px 48px}
.chip{display:inline-block;background:#E8EDFF;color:#2B3BA8;border-radius:10px;padding:6px 12px;font-weight:600;font-size:13px;margin-bottom:22px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:34px;letter-spacing:-.5px}
.grid{display:grid;gap:18px;margin-bottom:18px}
.k4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.c32{grid-template-columns:2fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 2px 10px rgba(20,30,80,.04)}
.card h2{margin:0 0 14px;font-size:18px}
.kt{display:flex;justify-content:space-between;align-items:flex-start}
.ki{width:42px;height:42px;border-radius:12px;background:#EDF0FF;color:var(--b);display:flex;align-items:center;justify-content:center}
.big{font-size:38px;font-weight:700;letter-spacing:-1px;margin:6px 0}
.sub{color:var(--b);font-size:13px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;margin:12px 0 6px}
.track{height:10px;border-radius:5px;background:#EDEFF6}.fill{height:10px;border-radius:5px;background:linear-gradient(90deg,#3B5BFF,#7C5CFF)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#EDEFF6;color:#3A4468}
.tag.a{background:#FDEBC8;color:var(--amb)}.tag.g{background:#DDF3EE;color:#0A5C51}.tag.b{background:#E8EDFF;color:#2B3BA8}
.empty{color:var(--mut);padding:10px 0}
.wk{display:flex;gap:8px;align-items:flex-end;height:170px}
.wk>div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.wb{flex:1;background:#EDEFF6;border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}.wf{width:100%;background:linear-gradient(180deg,#5B6BFF,#7C5CFF)}
.ci{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #EEF0F7;padding:12px 14px;cursor:pointer}
.ci:hover,.ci.on{background:#F3F5FF}.ci>div{min-width:0;flex:1}.ci small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.lc{text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 10px rgba(20,30,80,.04)}
.lc:hover{border-color:var(--b)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.tc{cursor:default}.tc img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#EDEFF6}.tc details{font-size:13px;white-space:pre-wrap}
.sr{width:100%;max-width:340px;padding:11px 14px;border:1px solid #CBD2E6;border-radius:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;justify-content:space-between}
.cv{display:grid;grid-template-columns:340px 1fr;gap:18px;height:calc(100vh - 160px);min-height:500px}
.cl,.th{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.lst{overflow:auto;flex:1}.chips{display:flex;gap:6px;padding:12px;border-bottom:1px solid #EEF0F7;flex-wrap:wrap}
.chips .btn{min-height:36px;padding:5px 12px;font-size:13px}
.hd{padding:14px 18px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#F8F9FD}
.m{max-width:75%;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{background:#EDF0FF;border-color:#D5DBFF}.m.human{background:var(--b);border-color:var(--b);color:#fff;align-self:flex-end}
.m small{display:block;opacity:.75;font-size:11px;margin-bottom:2px}
.sys{align-self:center;font-size:12px;color:var(--amb);background:#FDEBC8;border-radius:99px;padding:3px 12px}
.comp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.comp textarea{flex:1;resize:none;padding:11px;border:1px solid #CBD2E6;border-radius:12px;height:48px}
table{width:100%;border-collapse:collapse}td{padding:10px 8px;border-top:1px solid #EEF0F7;font-size:13px}
.cols{display:flex;gap:4px;align-items:flex-end;height:130px}.cols div{flex:1;background:linear-gradient(180deg,#5B6BFF,#7C5CFF);border-radius:4px 4px 0 0;min-height:2px}
.cl2{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:6px}
.f{display:block;margin:0 0 14px}.f span{display:block;font-weight:600;margin-bottom:4px}.f input{width:100%;padding:12px;border:1px solid #CBD2E6;border-radius:12px}
pre{background:#F3F5FB;padding:12px;border-radius:10px;overflow:auto;font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0E1A47;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
#auth{display:flex;min-height:100vh}
.ap{flex:1;background:linear-gradient(160deg,#0E1A47,#1B2A80);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.ap h2{font-size:36px;margin:0;letter-spacing:-1px}.ap p{color:#C7D0F3;margin:0;max-width:420px}
.af{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.af form{width:100%;max-width:400px}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs .btn{flex:1}
.err{color:#B42318;min-height:20px;margin-bottom:8px;font-size:13px}
@media(max-width:860px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.brand,.me .row{display:none}.me{margin:0;border:0;padding:0}.main{padding:18px}.c32{grid-template-columns:1fr}.cv{grid-template-columns:1fr;height:auto}.cl{max-height:300px}.th{height:70vh}.ap{display:none}h1{font-size:26px}}
